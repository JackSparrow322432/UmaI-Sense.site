name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend — typecheck
        working-directory: umaisense-back-main
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: Frontend — build
        working-directory: umiasense-front-main
        run: npm ci --no-audit --no-fund && npm run build
