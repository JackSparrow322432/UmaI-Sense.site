# nginx на балансировщике (lb1, 10.10.0.5, публичный IP).
# Ставится в /etc/nginx/conf.d/umaisense.conf. Сертификаты — certbot (Let's Encrypt).
#
#   app.umaisense.kz  — фронтенд (статика) + /api → 2 сервера приложения + /media → публичные картинки
#   s3.umaisense.kz   — S3 API для загрузки/скачивания документов по одноразовым ссылкам
#   10.10.0.5:3900    — тот же S3 API для серверов приложения (внутренняя сеть)

upstream umaisense_api {
    # Если сервер не ответил 3 раза за 10 с — 10 с на него не шлём
    server 10.10.0.21:5000 max_fails=3 fail_timeout=10s;
    server 10.10.0.22:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream garage_s3 {
    server 10.10.0.11:3900 max_fails=3 fail_timeout=10s;
    server 10.10.0.12:3900 max_fails=3 fail_timeout=10s;
    server 10.10.0.13:3900 max_fails=3 fail_timeout=10s;
}

upstream garage_web {
    server 10.10.0.11:3902 max_fails=3 fail_timeout=10s;
    server 10.10.0.12:3902 max_fails=3 fail_timeout=10s;
    server 10.10.0.13:3902 max_fails=3 fail_timeout=10s;
}

# Лимит на вход/коды — дополнительно к лимитам в приложении (30 в минуту с IP, всплеск до 20)
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
    listen 80;
    server_name app.umaisense.kz s3.umaisense.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name app.umaisense.kz;

    ssl_certificate     /etc/letsencrypt/live/app.umaisense.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.umaisense.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Журнал запросов содержит IP пользователей — хранится 14 дней (logrotate), только на lb1
    access_log /var/log/nginx/umaisense.access.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Картинки до 5 МБ идут через API; документы — напрямую в S3, минуя этот лимит
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Фронтенд (собранный umiasense-front-main/dist)
    root /var/www/umaisense;
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        # только expires: собственный add_header отменил бы заголовки безопасности уровня server
        expires 1y;
    }

    # Лимит только на вход, коды и сброс пароля — не на /api/auth/me, который вызывается на каждой странице
    location ~ ^/api/auth/(login|send-otp|resend-otp|verify-otp|complete-registration|forgot-password|reset-password)$ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/umaisense-proxy.conf;
    }
    location /api/ {
        include /etc/nginx/snippets/umaisense-proxy.conf;
    }

    # Публичные картинки (бакет umaisense-public через веб-эндпоинт Garage)
    location /media/ {
        proxy_pass http://garage_web/;
        proxy_set_header Host umaisense-public.web.garage.internal;
        proxy_hide_header Set-Cookie;
        expires 30d;
    }
}

server {
    listen 443 ssl http2;
    server_name s3.umaisense.kz;

    ssl_certificate     /etc/letsencrypt/live/s3.umaisense.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.umaisense.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Документы до 20 МБ (запас на заголовки)
    client_max_body_size 25m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://garage_s3;
        # Host не меняем: на него рассчитана подпись одноразовой ссылки
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# S3 для серверов приложения — только во внутренней сети
server {
    listen 10.10.0.5:3900;
    client_max_body_size 25m;
    proxy_request_buffering off;
    allow 10.10.0.0/24;
    deny all;
    location / {
        proxy_pass http://garage_s3;
        proxy_set_header Host $http_host;
    }
}
