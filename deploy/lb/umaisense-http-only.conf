# Временный конфиг для первого выпуска сертификатов (до установки umaisense.conf).
#   mkdir -p /var/www/certbot
#   cp deploy/lb/umaisense-http-only.conf /etc/nginx/conf.d/umaisense.conf && nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/certbot -d app.umaisense.kz
#   certbot certonly --webroot -w /var/www/certbot -d s3.umaisense.kz
# Затем заменить на полный umaisense.conf. Продление работает само (тот же webroot на порту 80).
server {
    listen 80;
    server_name app.umaisense.kz s3.umaisense.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 503; }
}
